<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>You're Invited — Christening & Birthday Bash</title>
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: linear-gradient(180deg, #fbcfe8 0%, #f9a8d4 100%);
    font-family: 'Georgia', 'Times New Roman', serif;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* --- Cover / clickable page 1 --- */
  #cover {
    width: 100%;
    max-width: 620px;
    cursor: pointer;
    position: relative;
    display: block;
  }
  #cover img {
    width: 100%;
    display: block;
    max-width: 100%;
  }
  #cover-hint {
    position: fixed;
    left: 50%;
    bottom: calc(28px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    background: rgba(255,255,255,0.92);
    color: #7c3aed;
    padding: 10px 22px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 0.02em;
    box-shadow: 0 4px 18px rgba(0,0,0,0.18);
    animation: pulse 1.8s infinite;
    pointer-events: none;
    z-index: 10;
  }
  @keyframes pulse {
    0%, 100% { transform: translateX(-50%) scale(1); opacity: 1; }
    50% { transform: translateX(-50%) scale(1.05); opacity: 0.85; }
  }

  /* --- Scroll pages container --- */
  #scroll-pages {
    width: 100%;
    max-width: 620px;
    display: none;
    flex-direction: column;
  }
  #scroll-pages.visible { display: flex; }
  #scroll-pages img {
    width: 100%;
    display: block;
  }

  #cover.hidden { display: none; }

  /* subtle fade-in when scroll section appears */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  #scroll-pages.visible {
    animation: fadeIn 0.6s ease-out;
  }

  #back-to-top {
    position: fixed;
    right: 16px;
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    background: rgba(124,58,237,0.9);
    color: white;
    border: none;
    border-radius: 999px;
    width: 46px;
    height: 46px;
    font-size: 20px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 20;
  }
  #back-to-top.visible { display: flex; }

  /* --- RSVP form section --- */
  #rsvp {
    width: 100%;
    background: linear-gradient(180deg, #8ea9db 0%, #8ea9db 45%, #f9a8d4 45%, #f9a8d4 100%);
    padding: 40px 20px 50px;
    display: flex;
    justify-content: center;
  }
  #rsvp-card {
    background: #ffffff;
    width: 100%;
    max-width: 480px;
    border-radius: 28px;
    border: 6px solid #f6b8d2;
    padding: 32px 26px 26px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
  }
  #rsvp-card h2 {
    font-family: 'Arial', sans-serif;
    font-weight: 800;
    font-size: 26px;
    margin: 0 0 24px;
    color: #1a1a1a;
    line-height: 1.25;
  }
  .rsvp-label {
    font-family: 'Arial', sans-serif;
    font-weight: 700;
    font-size: 15px;
    color: #1a1a1a;
    margin-bottom: 10px;
    display: block;
  }
  .rsvp-field { margin-bottom: 26px; }
  .rsvp-field input[type="text"] {
    width: 100%;
    padding: 14px 12px;
    border-radius: 6px;
    border: 1.5px solid #999;
    font-size: 15px;
    font-family: 'Arial', sans-serif;
  }
  .rsvp-options { display: flex; flex-direction: column; gap: 12px; }
  .rsvp-option {
    display: block;
    position: relative;
  }
  .rsvp-option input[type="radio"] {
    position: absolute;
    opacity: 0;
    cursor: pointer;
  }
  .rsvp-option span {
    display: block;
    background: #e2e2e2;
    border-radius: 8px;
    padding: 16px 18px;
    font-family: 'Arial', sans-serif;
    font-size: 15px;
    color: #1a1a1a;
    cursor: pointer;
    transition: background 0.15s, box-shadow 0.15s;
  }
  .rsvp-option input[type="radio"]:checked + span {
    background: #cfe0ff;
    box-shadow: inset 0 0 0 2px #6d8fd9;
    font-weight: bold;
  }
  #rsvp-submit {
    width: 100%;
    background: #8ea9db;
    border: none;
    border-radius: 10px;
    padding: 18px;
    font-family: 'Arial', sans-serif;
    font-weight: 800;
    font-size: 17px;
    color: #1a1a1a;
    cursor: pointer;
    transition: background 0.15s;
  }
  #rsvp-submit:hover { background: #7c98cc; }
  #rsvp-note {
    text-align: center;
    font-family: 'Arial', sans-serif;
    font-size: 12px;
    color: #666;
    margin-top: 14px;
  }
  #rsvp-success {
    display: none;
    text-align: center;
    font-family: 'Arial', sans-serif;
    padding: 30px 10px;
  }
  #rsvp-success h2 { font-size: 22px; margin-bottom: 8px; }
  #rsvp-success p { color: #444; font-size: 15px; }
</style>
</head>

  <button id="back-to-top" title="Back to top">↑</button>

<script>
  const cover = document.getElementById('cover');
  const hint = document.getElementById('cover-hint');
  const scrollPages = document.getElementById('scroll-pages');
  const backToTop = document.getElementById('back-to-top');

  cover.addEventListener('click', () => {
    cover.classList.add('hidden');
    hint.style.display = 'none';
    scrollPages.classList.add('visible');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  window.addEventListener('scroll', () => {
    if (window.scrollY > 300 && scrollPages.classList.contains('visible')) {
      backToTop.classList.add('visible');
    } else {
      backToTop.classList.remove('visible');
    }
  });

  backToTop.addEventListener('click', () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  const rsvpForm = document.getElementById('rsvp-form');
  const rsvpSuccess = document.getElementById('rsvp-success');
  rsvpForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const submitBtn = document.getElementById('rsvp-submit');
    submitBtn.textContent = 'Sending...';
    submitBtn.disabled = true;
    try {
      const response = await fetch(rsvpForm.action, {
        method: 'POST',
        body: new FormData(rsvpForm),
        headers: { 'Accept': 'application/json' }
      });
      if (response.ok) {
        rsvpForm.style.display = 'none';
        rsvpSuccess.style.display = 'block';
      } else {
        alert('Something went wrong sending your RSVP. Please try again.');
        submitBtn.textContent = 'Submit';
        submitBtn.disabled = false;
      }
    } catch (err) {
      alert('Something went wrong sending your RSVP. Please try again.');
      submitBtn.textContent = 'Submit';
      submitBtn.disabled = false;
    }
  });
</script>
